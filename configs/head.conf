# Development head. The installer writes a complete configuration for you.
# Run from the checkout root; copy this to fronk.conf before editing it.
# Generate a cluster secret on the head (openssl rand -hex 32) and supply the
# same value through FRONK_SECRET on all machines. Do not commit that value.
name head
bind 0.0.0.0
interfaces auto
control-port 7700
data-port 7701
discovery-port 7702
multicast 239.7.7.7
password-env FRONK_SECRET
burst 3
state-dir runs/state-head
profile-file runs/profile-head.txt
model weights/Qwen3.8-Flash-Next-Q4.gguf
ds4 builtin
