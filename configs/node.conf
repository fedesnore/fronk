# Automatic node: name defaults to the system hostname.
# Development example; the installer creates the paired configuration instead.
# Use the head's FRONK_SECRET and burst on every machine in the cluster.
bind 0.0.0.0
interfaces auto
control-port 7700
data-port 7701
discovery-port 7702
multicast 239.7.7.7
password-env FRONK_SECRET
burst 3
state-dir runs/state-node
profile-file runs/profile-node.txt
