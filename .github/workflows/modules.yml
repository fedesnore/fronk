name: Classify pull requests
on:
  workflow_run:
    workflows: [Core and documentation]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number to classify
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  issues: write
concurrency:
  group: module-labels
  cancel-in-progress: false
jobs:
  label:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted default-branch code, never the PR's checkout or artifacts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 .github/triage.py
        env:
          GH_TOKEN: ${{ github.token }}
