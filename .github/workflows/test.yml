name: Core and documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        # Hosted macOS jobs have waited for a runner or hit the time limit, cause unknown, so
        # they run only on request: Actions, Core and documentation, Run workflow.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","macos-15"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 tools/check-docs.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash tests/backend-modules.sh
      - run: python3 tools/release/export-source.py build/public-check
      - run: make engine
        working-directory: build/public-check
      - run: make DS4= test-core
        working-directory: build/public-check
      - run: make DS4= test-plane-cluster
        working-directory: build/public-check
      - name: Installer lifecycle from the exported source
        run: FRONK_TEST_MANAGER="$PWD/tools/install/fronk-install.sh" bash tests/installer.sh
        working-directory: build/public-check
